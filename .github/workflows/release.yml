name: Publish HACS release

on:
  push:
    branches: [main]
    paths:
      - "custom_components/linus_l2_unlatch/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Read integration version
        id: version
        shell: bash
        run: |
          version=$(python3 -c 'import json; print(json.load(open("custom_components/linus_l2_unlatch/manifest.json"))["version"])')
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
